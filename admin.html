<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atelier Admin — Victoria Fashion</title>
    <link rel="icon" type="image/png" href="./images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Exact Same Site Stylesheet -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-black text-[#f5f5f7] font-apple antialiased min-h-screen flex flex-col justify-between selection:bg-[#0071e3] selection:text-white">

    <!-- ============================================================= -->
    <!-- 1. CLEAN ATELIER HEADER                                       -->
    <!-- ============================================================= -->
    <header class="sticky top-0 z-50 w-full bg-black/90 backdrop-blur-md border-b border-white/10">
      <div class="max-w-[1200px] mx-auto px-4 sm:px-8 h-[48px] flex items-center justify-between text-[12px]">
        
        <!-- Brand Name -->
        <a href="./index.html" class="flex items-baseline text-white hover:opacity-80 transition-opacity">
          <img 
            src="./images/logo-v.png" 
            alt="V" 
            style="height: 1.1em; width: auto; object-fit: contain; vertical-align: baseline; margin-right: -0.16em; display: inline-block; filter: drop-shadow(0 0 10px rgba(41,151,255,0.7));" 
          /><span class="font-extrabold text-sm sm:text-base tracking-[0.14em] uppercase text-white">ICTORIA FASHION</span>
        </a>

        <!-- Right Actions -->
        <div class="flex items-center gap-4">
          <a
            href="./index.html"
            target="_blank"
            class="text-[#2997ff] hover:underline text-xs flex items-center gap-1"
          >
            <span>Live Website</span>
            <span class="text-[10px]">↗</span>
          </a>

          <button
            id="header-logout-btn"
            onclick="handleLogout()"
            class="hidden text-[#86868b] hover:text-white text-xs transition-colors border border-white/10 px-3 py-1 rounded-full hover:border-white/30"
          >
            Lock
          </button>
        </div>
      </div>
    </header>

    <!-- ============================================================= -->
    <!-- 2. MINIMAL SIGN-IN GATE                                       -->
    <!-- ============================================================= -->
    <div id="login-modal" class="flex-1 flex items-center justify-center p-4">
      <div class="w-full max-w-sm mx-auto text-center">
        <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 20px;">
          <input 
            type="password" 
            id="admin-passcode" 
            placeholder="Enter passcode" 
            class="w-full bg-[#161618] text-white border border-white/20 hover:border-white/40 focus:border-white focus:bg-[#1c1c1e] rounded-full px-6 py-3.5 text-sm text-center focus:outline-none placeholder:text-neutral-500 transition-all duration-200 font-apple tracking-wider"
            required
            autocomplete="current-password"
            autofocus
          />
          <p id="login-error" class="hidden text-xs text-rose-400 font-medium" style="margin: -6px 0 0 0;"></p>
          <button 
            type="submit" 
            class="w-full bg-white hover:bg-neutral-200 text-black font-semibold py-3.5 rounded-full text-sm transition-all duration-200 active:scale-95 shadow-[0_4px_20px_rgba(255,255,255,0.12)] tracking-wide"
          >
            Unlock
          </button>
        </form>
      </div>
    </div>

    <!-- ============================================================= -->
    <!-- 3. MAIN CLEAN ADMIN APP                                       -->
    <!-- ============================================================= -->
    <main id="admin-app" class="hidden flex-1 w-full max-w-[1200px] mx-auto px-4 sm:px-8 py-8 space-y-8">

      <!-- Upload Card -->
      <section class="bg-[#121214] border border-white/10 rounded-2xl p-6 shadow-2xl">
        <h2 class="text-lg font-semibold text-white tracking-tight mb-5">Upload Outfit</h2>

        <form onsubmit="handleUpload(event)" class="space-y-5">
          
          <!-- Category Selector -->
          <div>
            <label class="text-[11px] text-[#86868b] uppercase tracking-wider block mb-2 font-medium">Category</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
              <button 
                type="button" 
                onclick="selectCategory('women')" 
                id="dept-btn-women"
                class="dept-btn py-3 px-4 rounded-xl border text-center transition-all border-white text-white font-medium bg-white/10"
              >
                Women
              </button>
              <button 
                type="button" 
                onclick="selectCategory('men')" 
                id="dept-btn-men"
                class="dept-btn py-3 px-4 rounded-xl border text-center transition-all border-white/10 text-[#86868b] hover:text-white"
              >
                Men
              </button>
              <button 
                type="button" 
                onclick="selectCategory('children')" 
                id="dept-btn-children"
                class="dept-btn py-3 px-4 rounded-xl border text-center transition-all border-white/10 text-[#86868b] hover:text-white"
              >
                Children
              </button>
              <button 
                type="button" 
                onclick="selectCategory('occasions')" 
                id="dept-btn-occasions"
                class="dept-btn py-3 px-4 rounded-xl border text-center transition-all border-white/10 text-[#86868b] hover:text-white"
              >
                Occasions
              </button>
            </div>
          </div>

          <!-- Photo Picker & Title Fields -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- Photo Picker -->
            <div>
              <label class="text-[11px] text-[#86868b] uppercase tracking-wider block mb-2 font-medium">Photo</label>
              <div 
                onclick="document.getElementById('image-file').click()"
                class="border border-white/15 hover:border-white/40 transition-colors rounded-xl p-3 bg-[#18181a] cursor-pointer flex items-center gap-3 min-h-[50px]"
              >
                <input 
                  type="file" 
                  id="image-file" 
                  accept="image/*" 
                  class="hidden" 
                  onchange="handleImagePreview(event)" 
                  required 
                />
                <img id="image-preview" src="" alt="" class="hidden w-11 h-11 object-cover rounded-lg border border-white/20" />
                <span id="file-label" class="text-xs text-[#86868b] truncate">
                  Tap to choose photo...
                </span>
              </div>
            </div>

            <!-- Title -->
            <div>
              <label class="text-[11px] text-[#86868b] uppercase tracking-wider block mb-2 font-medium">Outfit Name</label>
              <input 
                type="text" 
                id="item-title" 
                placeholder="e.g. Royal Emerald Boubou" 
                class="w-full bg-[#18181a] text-white border border-white/15 rounded-xl px-4 py-3.5 text-xs focus:border-white focus:outline-none placeholder:text-neutral-600 font-apple transition-colors"
                required
              />
            </div>
          </div>

          <!-- Submit Button -->
          <div class="flex items-center gap-4 pt-2">
            <button 
              type="submit" 
              id="upload-btn"
              class="bg-white hover:bg-neutral-200 text-black font-semibold py-3 px-8 rounded-full text-xs transition-transform active:scale-95 disabled:opacity-50"
            >
              <span id="upload-btn-text">Publish Outfit</span>
            </button>
            <span id="upload-status" class="hidden text-xs font-medium"></span>
          </div>

        </form>
      </section>

      <!-- Active Gallery Section -->
      <section class="space-y-4">
        
        <!-- Filter Header -->
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <div class="flex items-center gap-2">
            <h2 class="text-base font-semibold text-white">Gallery</h2>
            <span id="gallery-count" class="text-xs text-[#86868b]"></span>
          </div>

          <!-- Category Filter Pills -->
          <div class="flex items-center gap-3 sm:gap-5 text-xs font-medium">
            <button onclick="setFilter('all')" class="cat-filter-btn text-white font-semibold border-b-2 border-white pb-1" data-filter="all">All</button>
            <button onclick="setFilter('women')" class="cat-filter-btn text-[#86868b] hover:text-white pb-1" data-filter="women">Women</button>
            <button onclick="setFilter('men')" class="cat-filter-btn text-[#86868b] hover:text-white pb-1" data-filter="men">Men</button>
            <button onclick="setFilter('children')" class="cat-filter-btn text-[#86868b] hover:text-white pb-1" data-filter="children">Children</button>
            <button onclick="setFilter('occasions')" class="cat-filter-btn text-[#86868b] hover:text-white pb-1" data-filter="occasions">Occasions</button>
          </div>
        </div>

        <!-- Grid -->
        <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-5"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden py-16 text-center text-[#86868b]">
          <p class="text-sm">No outfits uploaded in this category yet.</p>
        </div>

      </section>

    </main>

    <!-- JavaScript Controller -->
    <script>
      const SUPABASE_URL = "https://pseyowecodortdepdcgu.supabase.co";
      const SUPABASE_SERVICE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzZXlvd2Vjb2RvcnRkZXBkY2d1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDU1NTg5MSwiZXhwIjoyMTAwMTMxODkxfQ.BpD8G_z7Jo04cGER85kXqT0Qaj0y020krZ2rjR6Y-wA";
      const BUCKET_NAME = "victoria-images";
      const MANIFEST_FILE = "manifest.json";
      const ATELIER_PASSCODE = "victoria2026";

      const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY, {
        auth: { persistSession: false }
      });

      let selectedCategory = 'women';
      let currentItems = [];
      let activeFilter = 'all';

      if (localStorage.getItem('vf_admin_auth') === 'true' || sessionStorage.getItem('vf_admin_auth') === 'true') {
        showAdmin();
      }

      function handleLogin(e) {
        if (e) e.preventDefault();
        const input = document.getElementById('admin-passcode');
        const code = input ? input.value.trim().toLowerCase() : '';
        const errEl = document.getElementById('login-error');

        if (code === ATELIER_PASSCODE.toLowerCase()) {
          localStorage.setItem('vf_admin_auth', 'true');
          sessionStorage.setItem('vf_admin_auth', 'true');
          showAdmin();
        } else {
          if (errEl) {
            errEl.textContent = 'Incorrect passcode.';
            errEl.classList.remove('hidden');
          }
        }
      }

      function handleLogout() {
        localStorage.removeItem('vf_admin_auth');
        sessionStorage.removeItem('vf_admin_auth');
        window.location.reload();
      }

      function showAdmin() {
        const modal = document.getElementById('login-modal');
        const app = document.getElementById('admin-app');
        const logoutBtn = document.getElementById('header-logout-btn');
        if (modal) modal.classList.add('hidden');
        if (app) app.classList.remove('hidden');
        if (logoutBtn) logoutBtn.classList.remove('hidden');
        loadGallery();
      }

      function selectCategory(cat) {
        selectedCategory = cat;
        document.querySelectorAll('.dept-btn').forEach(btn => {
          btn.className = "dept-btn py-3 px-4 rounded-xl border text-center transition-all border-white/10 text-[#86868b] hover:text-white";
        });
        const activeBtn = document.getElementById('dept-btn-' + cat);
        if (activeBtn) {
          activeBtn.className = "dept-btn py-3 px-4 rounded-xl border text-center transition-all border-white text-white font-medium bg-white/10";
        }
      }

      function handleImagePreview(e) {
        const file = e.target.files[0];
        if (!file) return;

        const label = document.getElementById('file-label');
        const preview = document.getElementById('image-preview');

        if (label) label.textContent = file.name;

        const reader = new FileReader();
        reader.onload = (event) => {
          if (preview) {
            preview.src = event.target.result;
            preview.classList.remove('hidden');
          }
        };
        reader.readAsDataURL(file);
      }

      async function loadGallery() {
        const countEl = document.getElementById('gallery-count');
        try {
          const timestamp = new Date().getTime();
          const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${MANIFEST_FILE}?t=${timestamp}`);
          if (res.ok) {
            currentItems = await res.json();
            if (!Array.isArray(currentItems)) currentItems = [];
          } else {
            currentItems = [];
          }
        } catch (err) {
          console.error('Error loading manifest:', err);
          currentItems = [];
        }
        if (countEl) countEl.textContent = `(${currentItems.length})`;
        renderGallery();
      }

      function setFilter(cat) {
        activeFilter = cat;
        document.querySelectorAll('.cat-filter-btn').forEach(btn => {
          if (btn.dataset.filter === cat) {
            btn.className = "cat-filter-btn text-white font-semibold border-b-2 border-white pb-1";
          } else {
            btn.className = "cat-filter-btn text-[#86868b] hover:text-white pb-1";
          }
        });
        renderGallery();
      }

      function renderGallery() {
        const grid = document.getElementById('gallery-grid');
        const empty = document.getElementById('empty-state');
        
        const filtered = activeFilter === 'all' 
          ? currentItems 
          : currentItems.filter(i => (i.category || '').toLowerCase() === activeFilter.toLowerCase());

        if (filtered.length === 0) {
          grid.innerHTML = '';
          empty.classList.remove('hidden');
          return;
        }

        empty.classList.add('hidden');
        grid.innerHTML = filtered.map(item => `
          <div class="relative group bg-[#121214] border border-white/10 rounded-xl overflow-hidden flex flex-col">
            <div class="aspect-[3/4] w-full overflow-hidden bg-black relative">
              <img src="${item.image_url}" alt="${item.title || 'Outfit'}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
              <button 
                onclick="deleteItem('${item.id}', '${item.storage_path}')"
                title="Delete Outfit"
                class="absolute top-2 right-2 bg-black/80 hover:bg-rose-600 text-white rounded-full p-2 transition-colors border border-white/20"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
            <div class="p-3 flex items-center justify-between text-xs">
              <span class="font-medium text-white truncate max-w-[130px]">${item.title || 'Bespoke Design'}</span>
              <span class="text-[10px] uppercase text-[#86868b] tracking-wider">${item.category || ''}</span>
            </div>
          </div>
        `).join('');
      }

      async function handleUpload(e) {
        e.preventDefault();
        const fileInput = document.getElementById('image-file');
        const titleInput = document.getElementById('item-title');
        const btn = document.getElementById('upload-btn');
        const btnText = document.getElementById('upload-btn-text');
        const status = document.getElementById('upload-status');

        if (!fileInput.files || fileInput.files.length === 0) {
          alert('Please pick a photo.');
          return;
        }

        const file = fileInput.files[0];
        const ext = file.name.split('.').pop() || 'jpg';
        const fileId = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
        const storagePath = `${selectedCategory}/${fileId}.${ext}`;

        try {
          btn.disabled = true;
          btnText.textContent = "Uploading...";
          status.className = "text-xs text-[#86868b] font-medium";
          status.textContent = "Uploading to storage...";
          status.classList.remove('hidden');

          const { error: uploadError } = await sbClient
            .storage
            .from(BUCKET_NAME)
            .upload(storagePath, file, {
              cacheControl: '3600',
              upsert: false
            });

          if (uploadError) throw uploadError;

          const { data: urlData } = sbClient
            .storage
            .from(BUCKET_NAME)
            .getPublicUrl(storagePath);

          const publicUrl = urlData.publicUrl;

          const newItem = {
            id: fileId,
            category: selectedCategory,
            title: titleInput.value.trim(),
            image_url: publicUrl,
            storage_path: storagePath,
            created_at: new Date().toISOString()
          };

          currentItems.unshift(newItem);

          const manifestBlob = new Blob([JSON.stringify(currentItems, null, 2)], { type: 'application/json' });
          const { error: manifestError } = await sbClient
            .storage
            .from(BUCKET_NAME)
            .upload(MANIFEST_FILE, manifestBlob, {
              contentType: 'application/json',
              upsert: true
            });

          if (manifestError) throw manifestError;

          status.className = "text-xs text-emerald-400 font-medium";
          status.textContent = "✓ Published!";
          
          fileInput.value = '';
          titleInput.value = '';
          document.getElementById('file-label').textContent = 'Tap to choose photo...';
          document.getElementById('image-preview').classList.add('hidden');

          const countEl = document.getElementById('gallery-count');
          if (countEl) countEl.textContent = `(${currentItems.length})`;

          renderGallery();

          setTimeout(() => {
            status.classList.add('hidden');
          }, 3000);

        } catch (err) {
          console.error('Upload failed:', err);
          status.className = "text-xs text-rose-400 font-medium";
          status.textContent = "Error: " + (err.message || err);
        } finally {
          btn.disabled = false;
          btnText.textContent = "Publish Outfit";
        }
      }

      async function deleteItem(id, storagePath) {
        if (!confirm('Permanently delete this outfit?')) return;

        try {
          if (storagePath) {
            await sbClient
              .storage
              .from(BUCKET_NAME)
              .remove([storagePath]);
          }

          currentItems = currentItems.filter(i => i.id !== id);

          const manifestBlob = new Blob([JSON.stringify(currentItems, null, 2)], { type: 'application/json' });
          await sbClient
            .storage
            .from(BUCKET_NAME)
            .upload(MANIFEST_FILE, manifestBlob, {
              contentType: 'application/json',
              upsert: true
            });

          const countEl = document.getElementById('gallery-count');
          if (countEl) countEl.textContent = `(${currentItems.length})`;
          renderGallery();
        } catch (err) {
          console.error('Delete failed:', err);
          alert('Delete failed: ' + (err.message || err));
        }
      }
    </script>
  </body>
</html>
